# /etc/nordvpn-rotate.conf — tuning for nordvpn-rotate.sh
# Shell syntax (KEY=value, no spaces around =). Missing keys use script defaults.

# Mode: 0 = live (default — the rotator actually switches servers),
# 1 = dry-run (log decisions only, never touch the tunnel — for testing).
DRY_RUN=0

# NordVPN country id (81 = Germany; list: api.nordvpn.com/v1/servers/countries)
COUNTRY_ID=81

# Switch when the current server's load reaches this percentage...
LOAD_THRESHOLD=60
# ...and only if the best candidate is at least this much lower (anti-flap):
MIN_IMPROVEMENT=15

# How many top-ranked servers are considered as switch targets (and shown on
# the dashboard). The script always fetches at least 20 internally so the
# current server's load stays visible even with a small value here.
CANDIDATES=20

# Never switch again within this many minutes (anti-flap)
MIN_DWELL_MIN=60

# Delist verification (defaults suit almost everyone). A server missing from
# the fetched pool is NOT treated as delisted — NordVPN rotates which ~20
# servers it surfaces — until it is also absent from a deep top-PROBE_LIMIT
# probe on MISS_LIMIT consecutive cycles.
#PROBE_LIMIT=100
#MISS_LIMIT=2

# Rotate once nightly at 04:15 (second cron line) for a fresh IP while nobody
# is online — websites sometimes block shared VPN IPs; a daily change ages
# that out. 1 = on (default), anything else = off.
# On-demand fresh IP anytime:  nordvpn-rotate.sh force
NIGHTLY_ROTATE=1

# GL.iNet 4.x WireGuard client interface + NordVPN WireGuard port.
# Leave PEER_SECTION empty to follow whatever peer the GL panel has active.
# NOTE: on the XE3000 (fw 4.8.3) the interface is wgclient1, not the wgclient
# most forum docs mention — verified on the real router 2026-08-18.
WG_IFACE=wgclient1
WG_PORT=51820
#PEER_SECTION=
