# /etc/nordvpn-rotate.conf — tuning for nordvpn-rotate.sh
# Shell syntax (KEY=value, no spaces around =). Missing keys use script defaults.

# SAFETY: 1 = log decisions only, never touch the tunnel. Set to 0 only after
# the dry-run phase looked sane for a few days.
DRY_RUN=1

# NordVPN country id (81 = Germany; list: api.nordvpn.com/v1/servers/countries)
COUNTRY_ID=81

# Switch when the current server's load reaches this percentage...
LOAD_THRESHOLD=60
# ...and only if the best candidate is at least this much lower (anti-flap):
MIN_IMPROVEMENT=15

# How many recommended servers to fetch per check (they arrive best-first)
CANDIDATES=20

# Never switch again within this many minutes (anti-flap)
MIN_DWELL_MIN=60

# Rotate once nightly (~04:30, second cron line) for a fresh IP while nobody
# is online — websites sometimes block shared VPN IPs; a daily change ages
# that out. 1 = on, anything else = off.
# On-demand fresh IP anytime:  nordvpn-rotate.sh force
NIGHTLY_ROTATE=0

# Dashboard login name (HTTP Basic). The password is whatever single line you
# write into /etc/rotator-dash.secret — while that file is absent the
# dashboard stays read-only and refuses every button press.
#DASH_USER=admin

# GL.iNet 4.x WireGuard client interface + NordVPN WireGuard port.
# Leave PEER_SECTION empty to follow whatever peer the GL panel has active.
# NOTE: on the XE3000 (fw 4.8.3) the interface is wgclient1, not the wgclient
# most forum docs mention — verified on the real router 2026-08-18.
WG_IFACE=wgclient1
WG_PORT=51820
#PEER_SECTION=
